openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dodolink NG API - Nigerian marketplace connecting retailers and customers
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stores
    description: Retailer store operations
  - name: products
    description: Product operations
  - name: search
    description: Search operations
  - name: messages
    description: Chat messaging operations
  - name: reviews
    description: Reviews and ratings
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: admin
    description: Admin-only operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Stores ────────────────────────────────────────────────────────────────
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List all stores
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: ownerUserId
          in: query
          description: Filter stores by owner user ID
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a new store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreBody"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "409":
          description: The user already owns a store or a verified store already uses this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{storeId}:
    get:
      operationId: getStore
      tags: [stores]
      summary: Get a store by ID
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDetail"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A verified store already uses this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreBody"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{storeId}/stats:
    get:
      operationId: getStoreStats
      tags: [stores]
      summary: Get store statistics (avg rating, total reviews, total products)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStats"

  # ─── Products ───────────────────────────────────────────────────────────────
  /stores/{storeId}/products:
    get:
      operationId: listStoreProducts
      tags: [products]
      summary: List products in a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Add a product to a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products (homepage feed)
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  # ─── Search ─────────────────────────────────────────────────────────────────
  # ─── Push Tokens ────────────────────────────────────────────────────────────
  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [stores]
      summary: Register an Expo push token for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenBody"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /push-registration-diagnostics:
    post:
      operationId: reportPushRegistrationDiagnostic
      tags: [stores]
      summary: Report a safe native push registration stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegistrationDiagnosticBody"
      responses:
        "200":
          description: Diagnostic recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search products and stores
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  # ─── Messages ───────────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations for a user/retailer
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Get messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [messages]
      summary: Mark a conversation as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]

  /conversations/start:
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start a conversation with a retailer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationBody"
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  # ─── Support ────────────────────────────────────────────────────────────────
  /support/messages:
    get:
      operationId: listSupportMessages
      tags: [support]
      summary: Get the authenticated user's support conversation
      responses:
        "200":
          description: Support messages for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportMessage"
        "401":
          description: Unauthorized
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a support message as the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSupportMessageBody"
      responses:
        "201":
          description: Support message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        "400":
          description: Invalid message
        "401":
          description: Unauthorized

  /support/read:
    post:
      operationId: markSupportRead
      tags: [support]
      summary: Mark admin support replies as read for the authenticated user
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
        "401":
          description: Unauthorized

  # ─── Reviews ────────────────────────────────────────────────────────────────
  /stores/{storeId}/reviews:
    get:
      operationId: listStoreReviews
      tags: [reviews]
      summary: List reviews for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Leave a review for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ─── Admin ────────────────────────────────────────────────────────────────
  /admin/stores:
    get:
      operationId: adminListStores
      tags: [admin]
      summary: List all stores with verification status (admin only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, verified, rejected]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/stores/{storeId}:
    patch:
      operationId: adminUpdateStore
      tags: [admin]
      summary: Edit a store's name/location and lock those fields for the owner (admin only)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateStoreBody"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /admin/stores/{storeId}/verify:
    post:
      operationId: adminVerifyStore
      tags: [admin]
      summary: Verify (approve) a store (admin only)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /admin/stores/{storeId}/hide:
    post:
      operationId: adminHideStore
      tags: [admin]
      summary: Hide a store from customers (admin only)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /admin/stores/{storeId}/restore:
    post:
      operationId: adminRestoreStore
      tags: [admin]
      summary: Restore a hidden store to visible (admin only)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /admin/stores/{storeId}/reject:
    post:
      operationId: adminRejectStore
      tags: [admin]
      summary: Reject a store application (admin only)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreRejectInput"
      responses:
        "200":
          description: Store rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /admin/analytics:
    get:
      operationId: adminGetAnalytics
      tags: [admin]
      summary: Get platform analytics (admin only)
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all app users with activity status (admin only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/admins:
    get:
      operationId: adminListAdmins
      tags: [admin]
      summary: List admin accounts (admin only)
      responses:
        "200":
          description: Admin accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEntry"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: adminAddAdmin
      tags: [admin]
      summary: Grant admin access to an email (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminBody"
      responses:
        "201":
          description: Admin added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntry"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Email is already an admin

  /admin/admins/{adminId}:
    delete:
      operationId: adminRemoveAdmin
      tags: [admin]
      summary: Revoke admin access (admin only)
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Admin removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
        "400":
          description: Cannot remove this admin
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Admin not found

  /admin/leads:
    get:
      operationId: adminListLeads
      tags: [admin]
      summary: List all contact form leads (admin only)
      responses:
        "200":
          description: Contact form submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactLead"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/support/threads:
    get:
      operationId: adminListSupportThreads
      tags: [admin]
      summary: List support conversation threads (admin only)
      responses:
        "200":
          description: Support threads with latest message and unread count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportThread"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/support/threads/{userId}/messages:
    get:
      operationId: adminListSupportMessages
      tags: [admin]
      summary: Get all messages in a user's support thread (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages in the thread
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportMessage"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: adminReplySupport
      tags: [admin]
      summary: Reply to a user's support thread (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSupportMessageBody"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        "400":
          description: Invalid message
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: No support thread for this user

  /admin/support/threads/{userId}/read:
    post:
      operationId: adminMarkSupportRead
      tags: [admin]
      summary: Mark a user's support messages as read (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── Subscription ─────────────────────────────────────────────────────────
  /stores/{storeId}/subscription:
    get:
      operationId: getSubscription
      tags: [stores]
      summary: Get subscription status and engagement count for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "404":
          description: Store not found

  /stores/{storeId}/subscription/initialize:
    post:
      operationId: initializeSubscription
      tags: [stores]
      summary: Initialize a Paystack payment for subscription
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInitInput"
      responses:
        "200":
          description: Checkout URL returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckout"
        "403":
          description: Store not eligible

  /stores/{storeId}/subscription/verify:
    post:
      operationId: verifySubscription
      tags: [stores]
      summary: Verify a Paystack payment reference and activate subscription
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionVerifyInput"
      responses:
        "200":
          description: Subscription activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "400":
          description: Payment verification failed

  /stores/{storeId}/subscription/charge:
    post:
      operationId: chargeSubscription
      tags: [stores]
      summary: Manually trigger auto-charge using saved authorization
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Charge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "400":
          description: No saved authorization or charge failed

  /stores/{storeId}/subscription/auto-pay:
    patch:
      operationId: toggleAutoPay
      tags: [stores]
      summary: Enable or disable auto-pay for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPayToggleInput"
      responses:
        "200":
          description: Auto-pay updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"

  # ─── Storage ──────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ContactLead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        description:
          type: string
        budget:
          type: string
        submittedAt:
          type: string
          format: date-time
      required: [id, name, email, description, budget, submittedAt]

    SupportMessage:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        userName:
          type: string
        userEmail:
          type: ["string", "null"]
        senderRole:
          type: string
          enum: [user, admin]
        body:
          type: string
        readByAdmin:
          type: boolean
        readByUser:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, userId, userName, senderRole, body, readByAdmin, readByUser, createdAt]

    SendSupportMessageBody:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
      required: [body]

    SupportThread:
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
        userEmail:
          type: ["string", "null"]
        lastMessage:
          type: string
        lastMessageAt:
          type: string
          format: date-time
        unreadCount:
          type: integer
        isSeller:
          type: boolean
      required: [userId, userName, lastMessage, lastMessageAt, unreadCount, isSeller]

    SubscriptionStatus:
      type: object
      properties:
        storeId:
          type: integer
        engagementCount:
          type: integer
        subscriptionAmountKobo:
          type: integer
          description: Monthly subscription fee in kobo, computed by the server
        premiumThreshold:
          type: integer
          description: Engagement count at which the premium fee applies
        qualified:
          type: boolean
        subscriptionStatus:
          type: string
          enum: [inactive, active, past_due]
        subscriptionDueAt:
          type: string
          format: date-time
          nullable: true
        subscriptionLastPaidAt:
          type: string
          format: date-time
          nullable: true
        qualifiedAt:
          type: string
          format: date-time
          nullable: true
        gracePeriodDaysRemaining:
          type: integer
          nullable: true
        isVisible:
          type: boolean
        autoPayEnabled:
          type: boolean
        hasAutoCharge:
          type: boolean
        paymentsLive:
          type: boolean
          description: True when the billing system is active (after Jan 1 2027)
        paymentsLaunchDate:
          type: string
          format: date-time
          description: ISO date when billing goes live
      required:
        - storeId
        - engagementCount
        - subscriptionAmountKobo
        - premiumThreshold
        - qualified
        - subscriptionStatus
        - isVisible
        - autoPayEnabled
        - hasAutoCharge
        - paymentsLive
        - paymentsLaunchDate

    SubscriptionInitInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    SubscriptionCheckout:
      type: object
      properties:
        checkoutUrl:
          type: string
        reference:
          type: string
      required: [checkoutUrl, reference]

    SubscriptionVerifyInput:
      type: object
      properties:
        reference:
          type: string
      required: [reference]

    AutoPayToggleInput:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]

    Store:
      type: object
      properties:
        id:
          type: integer
        ownerName:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        phone:
          type: string
        imageUrl:
          type: ["string", "null"]
        cacNumber:
          type: ["string", "null"]
        avgRating:
          type: ["number", "null"]
        totalReviews:
          type: integer
        verificationStatus:
          type: string
          enum: [pending, verified, rejected]
        detailsLockedByAdmin:
          type: boolean
        hiddenByAdmin:
          type: boolean
        verifiedAt:
          type: ["string", "null"]
          format: date-time
        verifiedBy:
          type: ["string", "null"]
        rejectionReason:
          type: ["string", "null"]
        qualifiedAt:
          type: ["string", "null"]
          format: date-time
        subscriptionStatus:
          type: string
          enum: [inactive, active, past_due]
        subscriptionDueAt:
          type: ["string", "null"]
          format: date-time
        subscriptionLastPaidAt:
          type: ["string", "null"]
          format: date-time
        autoPayEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, ownerName, ownerUserId, name, description, category, location, phone, totalReviews, verificationStatus, detailsLockedByAdmin, hiddenByAdmin, subscriptionStatus, autoPayEnabled, createdAt]

    StoreDetail:
      allOf:
        - $ref: "#/components/schemas/Store"
        - type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/Product"
          required: [products]

    StoreStats:
      type: object
      properties:
        storeId:
          type: integer
        avgRating:
          type: number
          nullable: true
        totalReviews:
          type: integer
        totalProducts:
          type: integer
        ratingBreakdown:
          type: object
          properties:
            "1":
              type: integer
            "2":
              type: integer
            "3":
              type: integer
            "4":
              type: integer
            "5":
              type: integer
          required: ["1", "2", "3", "4", "5"]
      required: [storeId, totalReviews, totalProducts, ratingBreakdown]

    CreateStoreBody:
      type: object
      properties:
        ownerName:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        phone:
          type: string
        imageUrl:
          type: string
          nullable: true
        cacNumber:
          type: string
          nullable: true
      required: [ownerName, ownerUserId, name, description, category, location, phone]

    AdminEntry:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        addedBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, email, createdAt]

    AddAdminBody:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
      required: [email]

    AdminUpdateStoreBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1

    UpdateStoreBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        phone:
          type: string
        imageUrl:
          type: string
          nullable: true
        cacNumber:
          type: string
          nullable: true

    Product:
      type: object
      properties:
        id:
          type: integer
        storeId:
          type: integer
        storeName:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: string
          description: Up to 5 product images. First image is the thumbnail.
        inStock:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, storeId, storeName, name, description, price, category, inStock, createdAt, imageUrls]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: string
          description: Up to 5 product image object paths.
        inStock:
          type: boolean
          default: true
      required: [name, description, price, category]

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: string
          description: Up to 5 product image object paths.
        inStock:
          type: boolean

    SearchResults:
      type: object
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        query:
          type: string
      required: [stores, products, query]

    Conversation:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: string
        customerName:
          type: string
        storeId:
          type: integer
        storeName:
          type: string
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, customerId, customerName, storeId, storeName, unreadCount, createdAt]

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: string
        senderName:
          type: string
        senderType:
          type: string
          enum: [customer, retailer]
        body:
          type: string
        mediaUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, senderId, senderName, senderType, body, createdAt]

    SendMessageBody:
      type: object
      properties:
        senderId:
          type: string
        senderName:
          type: string
        senderType:
          type: string
          enum: [customer, retailer]
        body:
          type: string
        mediaUrl:
          type: string
          nullable: true
      required: [senderId, senderName, senderType, body]

    StartConversationBody:
      type: object
      properties:
        customerId:
          type: string
        customerName:
          type: string
        storeId:
          type: integer
        initialMessage:
          type: string
      required: [customerId, customerName, storeId]

    Review:
      type: object
      properties:
        id:
          type: integer
        storeId:
          type: integer
        reviewerName:
          type: string
        reviewerId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, storeId, reviewerName, reviewerId, rating, comment, createdAt]

    RegisterPushTokenBody:
      type: object
      properties:
        userId:
          type: string
        token:
          type: string
        attemptId:
          type: string
          maxLength: 64
      required: [userId, token]

    PushRegistrationDiagnosticBody:
      type: object
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
        stage:
          type: string
          enum: [started, channel, permission, auth-token, expo-token, server-registration, completed]
        outcome:
          type: string
          enum: [started, success, denied, timeout, error]
        platform:
          type: string
          enum: [android, ios]
        appVersion:
          type: string
          maxLength: 32
        buildVersion:
          type: string
          maxLength: 32
        permissionStatus:
          type: string
          maxLength: 32
        errorCode:
          type: string
          maxLength: 64
      required: [attemptId, stage, outcome, platform, appVersion, buildVersion]

    CreateReviewBody:
      type: object
      properties:
        reviewerName:
          type: string
        reviewerId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      required: [reviewerName, reviewerId, rating, comment]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    StoreRejectInput:
      type: object
      properties:
        reason:
          type: string
      required: [reason]

    AdminAnalytics:
      type: object
      properties:
        totalStores:
          type: integer
        pendingStores:
          type: integer
        verifiedStores:
          type: integer
        rejectedStores:
          type: integer
        totalProducts:
          type: integer
        totalConversations:
          type: integer
        recentStores:
          type: array
          items:
            $ref: "#/components/schemas/Store"
      required: [totalStores, pendingStores, verifiedStores, rejectedStores, totalProducts, totalConversations, recentStores]

    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: string
        createdAt:
          type: integer
          description: Unix timestamp in milliseconds
        lastActiveAt:
          type: ["integer", "null"]
          description: Unix timestamp in milliseconds
        isActive:
          type: boolean
          description: True if lastActiveAt is within the last 30 days
        hasStore:
          type: boolean
        storeVerified:
          type: boolean
        storeName:
          type: ["string", "null"]
      required: [id, email, createdAt, isActive, hasStore, storeVerified]
