steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --file=Dockerfile
      - --tag=$_IMAGE_NAME:$COMMIT_SHA
      - --tag=$_IMAGE_NAME:latest
      - --cache-from=$_IMAGE_NAME:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - $_IMAGE_NAME

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_IMAGE_NAME:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --quiet

substitutions:
  _SERVICE_NAME: dodolink-api
  _REGION: us-central1
  _IMAGE_NAME: us-central1-docker.pkg.dev/$PROJECT_ID/dodolink/api-server

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
