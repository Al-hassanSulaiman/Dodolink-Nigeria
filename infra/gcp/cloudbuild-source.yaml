# This file builds from a clean GitHub checkout. Never use cloudbuild-api.yaml
# as a repository trigger: that older file expects a pre-generated context.
steps:
  - id: test-and-compile
    name: node:22-bookworm
    entrypoint: bash
    args: [infra/gcp/build-source.sh]
    env: [CI=1, EXPO_NO_DOTENV=1]
    secretEnv: [DODOLINK_CLERK_PRODUCTION_PUBLISHABLE_KEY]
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args: [build, --tag, '${_IMAGE}:$BUILD_ID', generated-artifacts/gcp-runtime]
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:$BUILD_ID']
  - id: release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: python3
    args:
      - infra/gcp/deploy-release.py
      - --project
      - $PROJECT_ID
      - --region
      - ${_REGION}
      - --image
      - '${_IMAGE}:$BUILD_ID'
      - --build
      - $BUILD_ID
      - --commit
      - $COMMIT_SHA
      - --bucket
      - ${_BUCKET}
      - --deploy
      - ${_DEPLOY}
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/dodolink-clerk-production-publishable-key/versions/1
      env: DODOLINK_CLERK_PRODUCTION_PUBLISHABLE_KEY
substitutions:
  _REGION: africa-south1
  _IMAGE: africa-south1-docker.pkg.dev/project-3a919f28-1462-4a1d-a2c/cloud-run-source-deploy/dodolink-web
  _BUCKET: dodolink-cicd-729481009477-afs1
  _DEPLOY: 'true'
images: ['${_IMAGE}:$BUILD_ID']
logsBucket: gs://dodolink-cicd-729481009477-afs1
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
