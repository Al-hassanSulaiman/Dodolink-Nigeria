name: dodolink-production-http-map
description: Prepared HTTP redirects for the live domains and staging.
defaultUrlRedirect:
  hostRedirect: dodolink.com.ng
  httpsRedirect: true
  redirectResponseCode: MOVED_PERMANENTLY_DEFAULT
  stripQuery: false
hostRules:
  - hosts:
      - staging.dodolink.com.ng
    pathMatcher: staging
pathMatchers:
  - name: staging
    defaultUrlRedirect:
      hostRedirect: staging.dodolink.com.ng
      httpsRedirect: true
      redirectResponseCode: MOVED_PERMANENTLY_DEFAULT
      stripQuery: false
