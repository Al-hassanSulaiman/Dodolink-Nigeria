apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dodolink-admin
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/dodolink/admin-dashboard:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "0.5"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 30
